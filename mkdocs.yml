site_name: OctoFlex Docs
site_url: https://docs.octoflex.es
site_description: Documentación oficial del proyecto OctoFlex 🚀
site_author: OctoFlex
copyright: Copyright &copy; 2026 OctoFlex

repo_url: https://github.com/octoflex/docs
repo_name: octoflex/docs
edit_uri: edit/main/docs/

nav:
  - Inicio: index.md
  - OctoFlex:
      - Qué es OctoFlex: octoflex/que-es.md
      - Servicios: octoflex/servicios.md
      - Arquitectura de referencia: octoflex/arquitectura.md
      - Decisiones técnicas: octoflex/decisiones.md
  - Tecnologías:
      - OpenStack: doc/openstack/openstack_base.md
      - Ceph: doc/ceph/ceph_base.md
  - Etiquetas: tags.md
  - Acerca de: about.md

theme:
  name: material
  custom_dir: overrides
  logo: images/logo.png
  favicon: images/favicon.png
  language: es
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
  palette:
    # Modo automático (sigue al sistema)
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Cambiar a modo claro

    # Modo claro
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro

    # Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Volver a las preferencias del sistema
  features:
    - content.action.edit
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Enlace permanente a esta sección
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search:
      lang:
        - es
        - en
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: es
          default: true
          name: Español
          build: true
        - locale: en
          name: English
          build: true
          site_description: Official documentation of the OctoFlex project 🚀
          nav_translations:
            Inicio: Home
            OctoFlex: OctoFlex
            Qué es OctoFlex: What is OctoFlex
            Servicios: Services
            Arquitectura de referencia: Reference architecture
            Decisiones técnicas: Technical decisions
            Tecnologías: Technologies
            Etiquetas: Tags
            Acerca de: About
  - tags
  - git-revision-date-localized:
      type: date
      enable_creation_date: true
      fallback_to_build_date: true
  # Sólo en CI: requieren descargar/renderizar recursos externos.
  - social:
      enabled: !ENV [CI, false]
  - privacy:
      enabled: !ENV [CI, false]
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true
      cache_safe: true

# Detecta enlaces rotos y páginas huérfanas durante el build.
# El blog queda fuera del build: el plugin `blog` de Material aún no es
# compatible con mkdocs-static-i18n (squidfunk/mkdocs-material#5909).
# El contenido se conserva en docs/blog/ para cuando se resuelva.
exclude_docs: |
  blog/

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/octoflex
      name: OctoFlex en GitHub
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/octoflex_es
      name: OctoFlex en Twitter
    - icon: material/book-open-page-variant
      link: https://docs.frikiteam.es
      name: Frikiteam Docs, documentación técnica del equipo
    - icon: material/rss
      link: https://frikiteam.es
      name: Frikiteam, el blog del equipo
  consent:
    title: Consentimiento de cookies
    description: >-
      Usamos cookies para reconocer tus visitas y preferencias repetidas, así
      como para medir la efectividad de nuestra documentación y si los usuarios
      encuentran lo que buscan. Con tu consentimiento, nos ayudas a mejorar
      nuestra documentación.
    actions:
      - accept
      - reject
      - manage
    cookies:
      analytics:
        name: Google Analytics
        checked: false
  analytics:
    provider: google
    property: G-X41K5YEY4S
    feedback:
      title: ¿Te ha resultado útil esta página?
      ratings:
        - icon: material/emoticon-happy-outline
          name: Sí, me ha sido útil
          data: 1
          note: >-
            ¡Gracias por tu comentario!
        - icon: material/emoticon-sad-outline
          name: No, puede mejorar
          data: 0
          note: >-
            Gracias por tu comentario. Ayúdanos a mejorar esta página
            <a href="https://github.com/octoflex/docs/issues/new/?title=[Feedback]+{title}+-+{url}" target="_blank" rel="noopener">abriendo una incidencia</a>.
