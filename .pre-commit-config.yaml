repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        # CNAME define el dominio publicado: no se toca.
        exclude: ^docs/CNAME$
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-yaml
        # mkdocs.yml usa tags !!python/name: que el parser estándar no entiende.
        exclude: ^mkdocs\.yml$
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
      - id: mixed-line-ending

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.45.0
    hooks:
      - id: markdownlint
        args: [--fix, --config, .markdownlint.yaml]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        # codespell sólo entiende inglés: sobre texto en español da falsos
        # positivos constantes ("oficial" -> "official"). Limitado a las
        # traducciones al inglés.
        files: \.en\.md$
